<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="אין כלום בבית" />
    <link rel="manifest" href="manifest.webmanifest?v=3" />
    <link rel="icon" type="image/png" href="./logo.png?v=3" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg?v=3" />
    <link rel="apple-touch-icon" href="./logo.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;800;900&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>אין כלום בבית</title>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="pre-splash" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;background-color:#faf9f6;font-family:system-ui,-apple-system,sans-serif;direction:rtl;gap:14px;padding:20px;">
        <img src="./logo.png?v=3" alt="אין כלום בבית" style="width:108px;height:108px;border-radius:50%;box-shadow:0 4px 16px rgba(15,23,42,0.12),inset 0 1px 0 rgba(255,255,255,0.9);border:1.5px solid rgba(15,23,42,0.08);object-fit:cover;" />
        <div style="font-family:'Frank Ruhl Libre',Georgia,serif;font-size:22px;font-weight:800;color:#1e293b;letter-spacing:-0.02em;">אין כלום בבית</div>
        <div style="font-size:13px;color:#64748b;font-weight:500;">רגע, פותחים את הרשימה…</div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
